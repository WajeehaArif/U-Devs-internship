    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, #1e304f, #3668b9);
      }

      .main-section {
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
      }

      /* Left content */
      .left-content {
        position: relative;

      .left-content h1 {

        color: #f1f5ff;
      }

      .left-content h1 span {

      .left-content p {
        color: #91a8cf;
        font-size: 20px;
        line-height: 1.6;
        max-width: 500px;
      }

      /* Sign up card */
      .signup-card {
        background: #fff;
        border-radius: 10px;
        padding: 60px;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }

      .form-control {
        height: 45px;
        border: 1px solid #bbb;
        border-radius: 5px;
        font-size: 18px;
      }

      .form-control:focus {
        box-shadow: none;
        border-color: #3f75c9;
      }

      .form-check {
        margin-top: 30px;
        margin-bottom: 35px;
      }

      .form-check-input {
        width: 22px;

        margin-right: 8px;
      }

      .form-check-label {

      .signup-btn {

        border: none;

      .signup-btn:hover {
        background-color: #3267b8;
      }

      .or-text {
        text-align: center;
        font-size: 18px;
        margin: 38px 0;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 42px;
      }

      .social-icons a {
        color: #3f75ca;
        font-size: 17px;
        background-color: #f1f5ff;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 5px 10px rgba(63, 117, 202, 0.25);
